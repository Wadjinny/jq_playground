<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jq Playground is a web assembly
version of jqplay, allowing you to run the full featured
jq in your browser, without sending anything to any backend.">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Jq Playground</title>
    <script>
      if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/jq_offline/service_worker.js', { scope: '/jq_offline' })
          .then(function(registration) {
                console.log('Service Worker Registered');
          })
          .catch(e => {
            console.log('Unable to register service worker', e);
          });

        navigator.serviceWorker.ready.then(function(registration) {
           console.log('Service Worker Ready');
        })
        .catch(e => {
          console.log('Service worker unable to get ready', e);
        });
      }
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://biowasm.com/cdn/v3/aioli.js"></script>
    <!-- Monaco Editor Loader -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.43.0/min/vs/loader.js"></script>
    <script>
      // Monaco Editor configuration
      require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.43.0/min/vs' }});
    </script>
    <script defer type="module">
      let monacoInputEditor;
      let monacoFilterEditor;
      let monacoOutputEditor;
      let CLI;

      const FLAG_IDS = ['compact-output', 'sort-keys', 'raw-input', 'raw-output', 'slurp'];

      function currentFlags() {
        const flags = {};
        FLAG_IDS.forEach(id => { flags[id] = document.getElementById(id).checked; });
        return flags;
      }

      async function setup() {
        // Populate the form from the url parameters
        let params = (new URL(document.location)).searchParams;

        let draft = {};
        try { draft = JSON.parse(localStorage.getItem('jq-draft')) || {}; } catch (e) {}
        window.initialInput = draft.input || '';

        let query = params.get('query');
        if (query) {
          // Store query to set in Monaco editor after initialization
          window.initialQuery = query;
        } else {
          // No shared link — restore the last session's draft
          window.initialQuery = draft.query || '';
          if (draft.flags) {
            FLAG_IDS.forEach(id => { document.getElementById(id).checked = !!draft.flags[id]; });
          }
        }
        FLAG_IDS.forEach(option => {
          let p = params.get(option);
          if (p === 'true') {
            document.getElementById(option).checked = true;
          }
        });
      }

      async function jq() {
        let data = monacoInputEditor.getValue();
        let query = monacoFilterEditor.getValue();

        let params = (new URL(document.location)).searchParams;
        let options = ["--monochrome-output"];
        let activeFlags = 0;
        FLAG_IDS.forEach(option => {
          let part = document.getElementById(option).checked;
          if (part) {
            params.set(option, true);
            options.push('--' + option);
            activeFlags++;
          } else {
            params.delete(option);
          }
        });
        document.getElementById('flag-count').textContent = activeFlags ? String(activeFlags) : '';

        // Update url query params with current query
        params.set('query', query);
        const url = new URL(document.location);
        url.search = params.toString();
        window.history.replaceState({}, 'Jq Offline', url);

        // Create mock JSON file
        await CLI.fs.writeFile("test.json", data);

        options.push(query);
        options.push("test.json");

        let output = await CLI.exec("jq", options);
        monacoOutputEditor.setValue(output);

        // Persist the working buffers so a reload restores them
        try {
          localStorage.setItem('jq-draft', JSON.stringify({ query, input: data, flags: currentFlags() }));
        } catch (e) {}
      }

      // buffer and call the callback only after no activity for "interval": aka debounce
      // This reduces load on the browser by avoiding jq evaluation while the user is typing
      function debounce(callback, interval) {
        let debounceTimeoutId;

        return function(...args) {
          clearTimeout(debounceTimeoutId);
          debounceTimeoutId = setTimeout(() => callback.apply(this, args), interval);
        };
      }

      let delayedJq = debounce(jq, 400);

      // Resizable panel grid: drag the 4px handles, arrow keys nudge, double-click resets
      function initResizeHandles() {
        const content = document.getElementById('content');
        const DEFAULT_QUERY_H = 82, DEFAULT_COL_L = 0.5;
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem('jq-layout')) || {}; } catch (e) {}
        let queryH = saved.queryH || DEFAULT_QUERY_H;
        let colL = saved.colL || DEFAULT_COL_L;

        const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

        function apply() {
          content.style.setProperty('--query-h', queryH + 'px');
          content.style.setProperty('--col-l', colL + 'fr');
          content.style.setProperty('--col-r', (1 - colL) + 'fr');
        }

        function persist() {
          localStorage.setItem('jq-layout', JSON.stringify({ queryH: Math.round(queryH), colL: +colL.toFixed(4) }));
        }

        function attach(id, onDrag, onNudge, onReset) {
          const handle = document.getElementById(id);
          handle.addEventListener('pointerdown', e => {
            e.preventDefault();
            try { handle.setPointerCapture(e.pointerId); } catch (err) {}
            handle.classList.add('dragging');
            const move = ev => { onDrag(ev, content.getBoundingClientRect()); apply(); };
            const stop = () => {
              handle.removeEventListener('pointermove', move);
              handle.classList.remove('dragging');
              persist();
            };
            handle.addEventListener('pointermove', move);
            handle.addEventListener('lostpointercapture', stop, { once: true });
            handle.addEventListener('pointerup', stop, { once: true });
          });
          handle.addEventListener('keydown', e => {
            const delta = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1 }[e.key];
            if (!delta) return;
            e.preventDefault();
            onNudge(delta, content.getBoundingClientRect());
            apply();
            persist();
          });
          handle.addEventListener('dblclick', () => { onReset(); apply(); persist(); });
        }

        attach('row-handle',
          (ev, rect) => { queryH = clamp(ev.clientY - rect.top, DEFAULT_QUERY_H, rect.height * 0.6); },
          (delta, rect) => { queryH = clamp(queryH + delta * 16, DEFAULT_QUERY_H, rect.height * 0.6); },
          () => { queryH = DEFAULT_QUERY_H; });

        attach('col-handle',
          (ev, rect) => { colL = clamp((ev.clientX - rect.left) / rect.width, 0.15, 0.85); },
          (delta) => { colL = clamp(colL + delta * 0.05, 0.15, 0.85); },
          () => { colL = DEFAULT_COL_L; });

        apply();
      }

      // Initialize Monaco editors after the page loads
      async function initMonacoEditors() {
        // Initialize Monaco editors
        require(['vs/editor/editor.main'], function() {
          // jq language: tokens, editing pairs, and a vs-dark-based theme for them
          monaco.languages.register({ id: 'jq' });

          monaco.languages.setMonarchTokensProvider('jq', {
            defaultToken: '',
            keywords: [
              'if', 'then', 'elif', 'else', 'end', 'as', 'def', 'reduce', 'foreach',
              'try', 'catch', 'label', 'break', 'import', 'include', 'module',
              'and', 'or', 'not'
            ],
            builtins: [
              'abs', 'acos', 'add', 'all', 'any', 'ascii', 'ascii_downcase', 'ascii_upcase',
              'asin', 'atan', 'builtins', 'capture', 'ceil', 'combinations', 'contains',
              'cos', 'debug', 'del', 'delpaths', 'empty', 'endswith', 'env', 'error',
              'exp', 'exp10', 'exp2', 'explode', 'fabs', 'first', 'flatten', 'floor',
              'format', 'from_entries', 'fromdate', 'fromdateiso8601', 'fromjson',
              'fromstream', 'getpath', 'gmtime', 'group_by', 'gsub', 'halt', 'halt_error',
              'has', 'implode', 'in', 'index', 'indices', 'infinite', 'input',
              'input_line_number', 'inputs', 'inside', 'isinfinite', 'isnan', 'isnormal',
              'join', 'keys', 'keys_unsorted', 'last', 'leaf_paths', 'length', 'limit',
              'localtime', 'log', 'log10', 'log2', 'ltrim', 'ltrimstr', 'map', 'map_values',
              'match', 'max', 'max_by', 'min', 'min_by', 'mktime', 'nan', 'now', 'nth',
              'path', 'paths', 'pick', 'pow', 'range', 'recurse', 'repeat', 'reverse',
              'rindex', 'round', 'rtrim', 'rtrimstr', 'scan', 'select', 'setpath', 'sin',
              'sort', 'sort_by', 'split', 'splits', 'sqrt', 'startswith', 'stderr',
              'strflocaltime', 'strftime', 'strptime', 'sub', 'tan', 'test', 'to_entries',
              'toarray', 'todate', 'todateiso8601', 'tojson', 'tonumber', 'tostream',
              'tostring', 'transpose', 'trim', 'truncate_stream', 'type', 'unique',
              'unique_by', 'until', 'utf8bytelength', 'values', 'walk', 'while', 'with_entries'
            ],
            tokenizer: {
              root: [
                [/#.*$/, 'comment'],
                [/@\w+/, 'annotation'],
                [/\$(__loc__|ENV|[A-Za-z_]\w*)/, 'variable'],
                [/\.\.(?!\.)/, 'operator'],
                [/\.[A-Za-z_]\w*/, 'field'],
                [/"/, { token: 'string.quote', next: '@string' }],
                [/\d+(\.\d+)?([eE][+-]?\d+)?/, 'number'],
                [/[A-Za-z_]\w*/, { cases: { '@keywords': 'keyword', '@builtins': 'type', '@default': 'identifier' } }],
                [/[{}()\[\]]/, '@brackets'],
                [/\?\/\/|\/\/=|\/\/|\|=|==|!=|<=|>=|\+=|-=|\*=|\/=|%=|[|+\-*\/%=<>?;:,.]/, 'operator'],
              ],
              string: [
                [/\\\(/, { token: 'delimiter.interpolation', next: '@interpolation' }],
                [/[^"\\]+/, 'string'],
                [/\\./, 'string.escape'],
                [/"/, { token: 'string.quote', next: '@pop' }],
              ],
              // \(...) holds a full jq expression; count parens so we pop at the matching one
              interpolation: [
                [/\(/, { token: 'delimiter.parenthesis', next: '@parens' }],
                [/\)/, { token: 'delimiter.interpolation', next: '@pop' }],
                { include: 'root' },
              ],
              parens: [
                [/\(/, { token: 'delimiter.parenthesis', next: '@push' }],
                [/\)/, { token: 'delimiter.parenthesis', next: '@pop' }],
                { include: 'root' },
              ],
            }
          });

          monaco.languages.setLanguageConfiguration('jq', {
            comments: { lineComment: '#' },
            brackets: [['{', '}'], ['[', ']'], ['(', ')']],
            autoClosingPairs: [
              { open: '{', close: '}' },
              { open: '[', close: ']' },
              { open: '(', close: ')' },
              { open: '"', close: '"', notIn: ['string'] },
            ],
            surroundingPairs: [
              { open: '{', close: '}' },
              { open: '[', close: ']' },
              { open: '(', close: ')' },
              { open: '"', close: '"' },
            ],
          });

          // vs-dark plus explicit colors for the jq tokens; builtins reuse the teal data channel
          monaco.editor.defineTheme('compact-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
              { token: 'keyword.jq', foreground: 'c586c0' },
              { token: 'type.jq', foreground: '4ec9b0' },
              { token: 'field.jq', foreground: '9cdcfe' },
              { token: 'variable.jq', foreground: '4fc1ff' },
              { token: 'annotation.jq', foreground: 'dcdcaa' },
              { token: 'string.jq', foreground: 'ce9178' },
              { token: 'string.quote.jq', foreground: 'ce9178' },
              { token: 'string.escape.jq', foreground: 'd7ba7d' },
              { token: 'delimiter.interpolation.jq', foreground: 'dcdcaa' },
              { token: 'number.jq', foreground: 'b5cea8' },
              { token: 'comment.jq', foreground: '6a9955' },
              { token: 'operator.jq', foreground: 'd4d4d4' },
              { token: 'identifier.jq', foreground: 'd4d4d4' },
            ],
            colors: {}
          });

          // Filter editor (jq query)
          monacoFilterEditor = monaco.editor.create(document.getElementById('filter-container'), {
            value: window.initialQuery || '',
            language: 'jq',
            minimap: { enabled: false },
            lineNumbers: 'off',
            scrollBeyondLastLine: false,
            wordWrap: 'on',
            automaticLayout: true,
            theme: 'compact-dark',
            fontSize: 13,
            padding: { top: 9, bottom: 9 },
            scrollbar: {
              vertical: 'hidden',
              horizontal: 'hidden'
            }
          });

          // Input JSON editor
          monacoInputEditor = monaco.editor.create(document.getElementById('input-json-container'), {
            value: window.initialInput || '',
            language: 'json',
            minimap: { enabled: true },
            automaticLayout: true,
            theme: 'compact-dark',
            fontSize: 13,
            padding: { top: 8, bottom: 8 }
          });

          // Output JSON editor (read-only)
          monacoOutputEditor = monaco.editor.create(document.getElementById('output-json-container'), {
            value: '',
            language: 'json',
            minimap: { enabled: true },
            readOnly: true,
            automaticLayout: true,
            theme: 'compact-dark',
            fontSize: 13,
            padding: { top: 8, bottom: 8 }
          });

          // Monaco defaults to CRLF on Windows (and mirrors CRLF found in restored
          // content), but jq's lexer rejects \r — force LF everywhere
          [monacoFilterEditor, monacoInputEditor, monacoOutputEditor].forEach(editor => {
            editor.getModel().setEOL(monaco.editor.EndOfLineSequence.LF);
          });

          // Add event listeners
          monacoFilterEditor.onDidChangeModelContent(delayedJq);
          monacoInputEditor.onDidChangeModelContent(delayedJq);

          // Add event listeners for checkboxes
          FLAG_IDS.forEach(id => document.getElementById(id).addEventListener('input', jq));

          // Call jq the first time
          jq();
        });
      }

      // Initialize everything
      setup();
      initResizeHandles();
      CLI = await new Aioli("jq/1.7");
      document.getElementById('engine-status').textContent = 'jq 1.7 · wasm ready';
      await initMonacoEditors();

      // Set up options popover toggle
      document.getElementById('options-toggle').addEventListener('click', function() {
        document.getElementById('options-popover').classList.toggle('hidden');
      });

      // Snapshots — named {query, input, flags} entries kept in localStorage
      function readSaves() {
        try { return JSON.parse(localStorage.getItem('jq-saves')) || []; } catch (e) { return []; }
      }

      function updateSavedCount() {
        const n = readSaves().length;
        document.getElementById('saved-count').textContent = n ? String(n) : '';
      }

      function loadSnapshot(snap) {
        FLAG_IDS.forEach(id => { document.getElementById(id).checked = !!(snap.flags && snap.flags[id]); });
        monacoInputEditor.setValue(snap.input || '');
        monacoFilterEditor.setValue(snap.query || ''); // change listeners re-run jq
      }

      function renderSaves() {
        const list = document.getElementById('saves-list');
        list.textContent = '';
        const saves = readSaves();
        if (!saves.length) {
          const li = document.createElement('li');
          li.className = 'saves-empty';
          li.textContent = 'no snapshots yet';
          list.appendChild(li);
          return;
        }
        saves.forEach(snap => {
          const li = document.createElement('li');
          const meta = document.createElement('div');
          meta.className = 'save-meta';
          const name = document.createElement('span');
          name.className = 'save-name';
          name.textContent = snap.name;
          const query = document.createElement('span');
          query.className = 'save-query';
          query.textContent = snap.query || '.';
          meta.append(name, query);
          const date = document.createElement('span');
          date.className = 'save-date';
          date.textContent = new Date(snap.savedAt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          const del = document.createElement('button');
          del.className = 'save-delete';
          del.title = 'Delete snapshot';
          del.textContent = '✕';
          del.addEventListener('click', ev => {
            ev.stopPropagation();
            localStorage.setItem('jq-saves', JSON.stringify(readSaves().filter(s => s.id !== snap.id)));
            renderSaves();
            updateSavedCount();
          });
          li.append(meta, date, del);
          li.addEventListener('click', () => {
            loadSnapshot(snap);
            document.getElementById('saved-popover').classList.add('hidden');
          });
          list.appendChild(li);
        });
      }

      function saveSnapshot() {
        const nameEl = document.getElementById('save-name');
        const hint = document.getElementById('save-hint');
        const name = nameEl.value.trim() || 'snapshot';
        const entry = {
          id: Math.random().toString(36).slice(2),
          name,
          query: monacoFilterEditor.getValue(),
          input: monacoInputEditor.getValue(),
          flags: currentFlags(),
          savedAt: Date.now()
        };
        const saves = readSaves().filter(s => s.name !== name); // same name overwrites
        saves.unshift(entry);
        try {
          localStorage.setItem('jq-saves', JSON.stringify(saves));
        } catch (e) {
          hint.textContent = 'storage full — could not save';
          hint.classList.add('error');
          return;
        }
        hint.textContent = '';
        hint.classList.remove('error');
        nameEl.value = '';
        updateSavedCount();
        document.getElementById('save-popover').classList.add('hidden');
      }

      document.getElementById('save-btn').addEventListener('click', function() {
        const pop = document.getElementById('save-popover');
        document.getElementById('saved-popover').classList.add('hidden');
        pop.classList.toggle('hidden');
        if (!pop.classList.contains('hidden')) {
          const nameEl = document.getElementById('save-name');
          if (!nameEl.value) {
            const q = monacoFilterEditor ? monacoFilterEditor.getValue().trim().replace(/\s+/g, ' ') : '';
            nameEl.value = q ? q.slice(0, 32) : 'snapshot';
          }
          nameEl.focus();
          nameEl.select();
        }
      });

      document.getElementById('save-confirm').addEventListener('click', saveSnapshot);

      document.getElementById('save-name').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') saveSnapshot();
        if (e.key === 'Escape') document.getElementById('save-popover').classList.add('hidden');
      });

      document.getElementById('saved-btn').addEventListener('click', function() {
        const pop = document.getElementById('saved-popover');
        document.getElementById('save-popover').classList.add('hidden');
        renderSaves();
        pop.classList.toggle('hidden');
      });

      updateSavedCount();

      // Every popover: ✕ closes it, clicking outside it (and its toggle) closes it
      document.querySelectorAll('.popover-close').forEach(btn => {
        btn.addEventListener('click', () => btn.closest('.popover').classList.add('hidden'));
      });

      document.addEventListener('click', function(event) {
        [['options-popover', 'options-toggle'], ['save-popover', 'save-btn'], ['saved-popover', 'saved-btn']].forEach(([popId, toggleId]) => {
          const popover = document.getElementById(popId);
          const toggle = document.getElementById(toggleId);
          if (!popover.contains(event.target) && !toggle.contains(event.target)) {
            popover.classList.add('hidden');
          }
        });
      });
    </script>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <h1>Jq Playground</h1>
            <span id="engine-status">jq 1.7 · loading wasm…</span>
            <span class="topbar-note">Nothing leaves this tab</span>
            <div class="toolbar">
                <div class="save-group">
                    <button id="save-btn" class="toolbar-btn" title="Save the current input and expression to this browser">Save</button>
                    <button id="saved-btn" class="toolbar-btn" title="Saved snapshots">Saved<span id="saved-count"></span></button>
                    <div id="save-popover" class="popover hidden">
                        <div class="popover-header">
                            <p>Save Snapshot</p>
                            <button class="popover-close" title="Close" aria-label="Close save dialog">✕</button>
                        </div>
                        <div class="save-form">
                            <input id="save-name" type="text" placeholder="snapshot name" spellcheck="false" maxlength="64" aria-label="Snapshot name">
                            <button id="save-confirm" class="primary-btn">Save</button>
                        </div>
                        <div id="save-hint" class="popover-hint"></div>
                    </div>
                    <div id="saved-popover" class="popover hidden">
                        <div class="popover-header">
                            <p>Saved Snapshots</p>
                            <button class="popover-close" title="Close" aria-label="Close saved list">✕</button>
                        </div>
                        <ul id="saves-list"></ul>
                    </div>
                </div>
                <a class="toolbar-btn" href="https://jqlang.github.io/jq/manual/v1.7/" target="_blank" rel="noopener">
                    <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14 3h7v7"/>
                        <path d="M10 14L21 3"/>
                        <path d="M21 14v7H3V3h7"/>
                    </svg>
                    <span>Manual</span>
                </a>
            </div>
        </header>

        <div id="content">
            <div id="query" class="panel">
                <div class="panel-header">
                    <div class="panel-title">Query <span class="hint">jq filter</span></div>
                    <button id="options-toggle" class="micro-btn" title="Toggle jq command-line flags" aria-label="Options">Flags<span id="flag-count"></span></button>
                    <div id="options-popover" class="popover hidden">
                        <div class="popover-header">
                            <p>Options</p>
                            <button class="popover-close" title="Close Options" aria-label="Close options">✕</button>
                        </div>
                        <ul id="options">
                          <li>
                            <input type="checkbox" id="compact-output" name="co">
                            <label for="compact-output" title="By default, jq pretty-prints JSON output. Using this option will result in more compact output by instead putting each JSON object on a single line.">--compact-output</label>
                          </li>
                          <li>
                            <input type="checkbox" id="sort-keys" name="sk">
                            <label for="sort-keys" title="Output the fields of each object with the keys in sorted order.">--sort-key</label>
                          </li>
                          <li>
                            <input type="checkbox" id="raw-input" name="ri">
                            <label for="raw-input" title="Don't parse the input as JSON. Instead, each line of text is passed to the filter as a string. If combined with --slurp, then the entire input is passed to the filter as a single long string.">--raw-input</label>
                          </li>
                          <li>
                            <input type="checkbox" id="raw-output" name="ro">
                            <label for="raw-output" title="With this option, if the filter's result is a string then it will be written directly to standard output rather than being formatted as a JSON string with quotes. This can be useful for making jq filters talk to non-JSON-based systems.">--raw-output</label>
                          </li>
                          <li>
                            <input type="checkbox" id="slurp" name="s">
                            <label for="slurp" title="Instead of running the filter for each JSON object in the input, read the entire input stream into a large array and run the filter just once.">--slurp</label>
                          </li>
                        </ul>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="filter-container"></div>
                </div>
            </div>

            <div id="row-handle" class="resize-handle" role="separator" aria-orientation="horizontal" aria-label="Resize query panel" tabindex="0"></div>

            <div id="input" class="panel">
                <div class="panel-header">
                    <div class="panel-title">Input <span class="hint">json</span></div>
                </div>
                <div class="panel-body">
                    <div id="input-json-container"></div>
                </div>
            </div>

            <div id="col-handle" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize input and result panels" tabindex="0"></div>

            <div id="output" class="panel">
                <div class="panel-header">
                    <div class="panel-title">Result <span class="hint">stdout</span></div>
                </div>
                <div class="panel-body">
                    <div id="output-json-container"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
